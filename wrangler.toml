# Serwer gry online na Cloudflare Workers: `npx wrangler deploy`
name = "snake-brawl"
main = "server/worker.js"
compatibility_date = "2025-09-01"

# Jeden Durable Object na pokój gry
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# Darmowy plan wymaga Durable Objects z SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
