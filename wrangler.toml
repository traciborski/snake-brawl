# Gra + serwer pokoi na Cloudflare Workers: `npm run deploy:server` (czyli `npx wrangler deploy`)
name = "snake-brawl"
main = "server/worker.js"
compatibility_date = "2025-09-01"

# Przed wystawieniem: sklejenie gry i złożenie folderu site/ (tylko pliki potrzebne w przeglądarce)
[build]
command = "node scripts/build.js --site"

# Pliki gry serwowane z tego samego adresu co pokoje (/room/KOD i /api/pokoje trafiają do workera)
[assets]
directory = "./site"

# Jeden Durable Object na pokój gry
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# Jeden Durable Object z listą aktywnych pokoi (strona /pokoje)
[[durable_objects.bindings]]
name = "ROOM_LIST"
class_name = "RoomListObject"

# Darmowy plan wymaga Durable Objects z SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomListObject"]
